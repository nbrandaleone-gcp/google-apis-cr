<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow3" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1835" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0b0f19" stop-opacity="1"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="1"/>
    </radialGradient>

    <!-- Gem Facet Gradients -->
    <linearGradient id="facetGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="facetGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="facetGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="editorBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="crystalGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="codeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#a855f7" flood-opacity="0.2"/>
    </filter>

    <!-- Pattern -->
    <pattern id="crystalGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2e1065" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bgGlow3)"/>
  <rect width="800" height="520" fill="url(#crystalGrid)"/>

  <!-- Ambient Light Spills -->
  <ellipse cx="680" cy="180" rx="160" ry="160" fill="#a855f7" fill-opacity="0.18" filter="url(#crystalGlow)"/>
  <ellipse cx="150" cy="400" rx="180" ry="120" fill="#ec4899" fill-opacity="0.12" filter="url(#crystalGlow)"/>

  <!-- Header & Stage Badge -->
  <g transform="translate(400, 48)" text-anchor="middle">
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#2e1065" stroke="#d946ef" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-118" cy="-1" r="4" fill="#f43f5e" filter="url(#crystalGlow)"/>
    <text x="8" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f0abfc" letter-spacing="1.5">STAGE 3 : CRYSTAL CODE</text>
    
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Typed, Compiled Crystal Client</text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Fast as C, readable as Ruby, verified with live Google Cloud Storage buckets</text>
  </g>

  <!-- Code Editor Window -->
  <g transform="translate(50, 125)" filter="url(#codeShadow)">
    <!-- Main Card Body -->
    <rect width="520" height="345" rx="14" fill="#0f172a" stroke="url(#editorBorder)" stroke-width="1.5"/>

    <!-- Window Header -->
    <g transform="translate(18, 16)">
      <circle cx="0" cy="0" r="5" fill="#ef4444"/>
      <circle cx="16" cy="0" r="5" fill="#eab308"/>
      <circle cx="32" cy="0" r="5" fill="#22c55e"/>

      <!-- File Tab -->
      <rect x="60" y="-11" width="220" height="22" rx="5" fill="#1e293b"/>
      <text x="75" y="4" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#cbd5e1">src/google_apis/storage/v1.cr</text>

      <!-- Shard badge -->
      <rect x="420" y="-11" width="70" height="22" rx="11" fill="#2e1065" stroke="#a855f7" stroke-width="0.8"/>
      <text x="455" y="4" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#f0abfc">SHARD v0.1</text>
    </g>

    <line x1="0" y1="38" x2="520" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Syntax Highlighted Crystal Code -->
    <g transform="translate(24, 62)" font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="11" line-height="1.5">
      <text y="0"><tspan fill="#f43f5e">module</tspan> <tspan fill="#38bdf8">GoogleApis::Storage::V1</tspan></text>
      
      <text y="20">  <tspan fill="#f43f5e">class</tspan> <tspan fill="#fbbf24">BucketsService</tspan> &lt; <tspan fill="#e2e8f0">GoogleApis::Service</tspan></text>
      
      <text y="42">    <tspan fill="#f43f5e">def</tspan> <tspan fill="#60a5fa">list</tspan>(<tspan fill="#e2e8f0">project</tspan> : <tspan fill="#34d399">String</tspan>, <tspan fill="#e2e8f0">max_results</tspan> : <tspan fill="#34d399">Int64?</tspan> = <tspan fill="#a855f7">nil</tspan>) : <tspan fill="#fbbf24">Buckets</tspan></text>
      
      <text y="64">      <tspan fill="#e2e8f0">params</tspan> = {<tspan fill="#a7f3d0">"project"</tspan> =&gt; <tspan fill="#e2e8f0">project</tspan>}</text>
      <text y="84">      <tspan fill="#e2e8f0">@client</tspan>.<tspan fill="#60a5fa">execute</tspan>(<tspan fill="#fbbf24">Buckets</tspan>, <tspan fill="#a7f3d0">"GET"</tspan>, <tspan fill="#a7f3d0">"b"</tspan>, <tspan fill="#e2e8f0">params</tspan>)</text>
      <text y="104">    <tspan fill="#f43f5e">end</tspan></text>
      <text y="124">  <tspan fill="#f43f5e">end</tspan></text>
      <text y="144"><tspan fill="#f43f5e">end</tspan></text>

      <!-- Separator line inside editor -->
      <line x1="0" y1="160" x2="472" y2="160" stroke="#1e293b" stroke-width="1"/>

      <!-- Live Execution Output Demo -->
      <text y="180" fill="#64748b"># Executing with Application Default Credentials:</text>
      <text y="200"><tspan fill="#e2e8f0">storage</tspan> = <tspan fill="#38bdf8">GoogleApis::Storage::V1::Client</tspan>.<tspan fill="#60a5fa">new</tspan>(<tspan fill="#e2e8f0">credentials</tspan>)</text>
      <text y="220"><tspan fill="#e2e8f0">buckets</tspan> = <tspan fill="#e2e8f0">storage</tspan>.<tspan fill="#e2e8f0">buckets</tspan>.<tspan fill="#60a5fa">list</tspan>(<tspan fill="#a7f3d0">"testing-355714"</tspan>)</text>

      <!-- Verified Success Callouts -->
      <g transform="translate(0, 235)">
        <rect x="0" y="0" width="220" height="24" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
        <text x="10" y="16" fill="#34d399" font-weight="700">✔ nbrandaleone-bucket</text>

        <rect x="230" y="0" width="220" height="24" rx="4" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="0.8"/>
        <text x="240" y="16" fill="#34d399" font-weight="700">✔ nbrandaleone-testing</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Glowing Crystal Language Emblem -->
  <g transform="translate(640, 240)">
    <!-- Outer energy aura -->
    <circle cx="0" cy="0" r="85" fill="#8b5cf6" fill-opacity="0.15" filter="url(#crystalGlow)"/>
    
    <!-- Crystalline Facets Gemstone (Crystal Logo motif) -->
    <!-- Top facets -->
    <polygon points="0,-70 -45,-30 0,0" fill="url(#facetGrad1)" filter="url(#crystalGlow)"/>
    <polygon points="0,-70 45,-30 0,0" fill="url(#facetGrad2)"/>
    
    <!-- Bottom facets -->
    <polygon points="-45,-30 0,70 0,0" fill="url(#facetGrad2)"/>
    <polygon points="45,-30 0,70 0,0" fill="url(#facetGrad3)"/>
    
    <!-- Outer rim edges -->
    <polygon points="0,-70 -45,-30 0,70 45,-30" fill="none" stroke="#f43f5e" stroke-width="2" filter="url(#crystalGlow)"/>
    <line x1="-45" y1="-30" x2="45" y2="-30" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8"/>
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8"/>

    <!-- Labels under crystal -->
    <text x="0" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#f8fafc" letter-spacing="1">CRYSTAL 1.21</text>
    
    <g transform="translate(0, 125)" text-anchor="middle">
      <rect x="-65" y="-10" width="130" height="20" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="0.8"/>
      <text x="0" y="4" font-family="sans-serif" font-size="9" font-weight="600" fill="#cbd5e1">COMPILED &amp; FAST</text>
    </g>
  </g>
</svg>
